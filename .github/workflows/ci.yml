name: CI — Razorpay Abuse-Ring Sentinel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (CPU-only PyTorch & PyG)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -r requirements.txt

      - name: Run complete test suite (Leakage + Graph + Features + API)
        run: |
          pytest tests/ -v --tb=short --no-header

      - name: Run benchmark reproduction & CI drift guard
        run: |
          python scripts/reproduce_benchmark.py
          python scripts/benchmark_latency.py
          python scripts/run_ablation_study.py
          python scripts/calibrate_probabilities.py
          python scripts/evaluate_adversarial.py
          python scripts/evaluate_tier4_research.py

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: outputs/
